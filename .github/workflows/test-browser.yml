name: Run browser tests

on:
  # Runs for pushes, pull requests, and manual triggers.
  # (Dooes not run when only some config is changed.)
  push:
    branches:
      - main
    paths-ignore:
      - 'src/config/*'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - 'src/config/**'
  workflow_dispatch:
    inputs:
      node_version:
        description: 'NodeJS version'
        required: true
        default: '22.x'

jobs:
  test-browser:
    # Only the Karma injection tests. The Puppeteer end-to-end suites
    # (test:chrome, test:chrome-mv3, test:firefox) are not run here:
    # the MV2 Chromium suite cannot load its extension in current Chrome.
    name: Run injection tests
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Configure Karma with path to Chrome executable
        run: |
          chrome --version
          { echo CHROME_BIN="$(which chrome)"; echo CHROME_TEST=1; } | tee -a "$GITHUB_ENV"

      - name: Install Firefox
        uses: browser-actions/setup-firefox@latest
        with:
          firefox-version: latest
      - name: Configure Karma with path to Firefox executable
        run: |
          firefox --version
          { echo FIREFOX_BIN="$(which firefox)"; echo FIREFOX_TEST=1; } | tee -a "$GITHUB_ENV"

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || '22.x' }}
          cache: npm

      - name: Install NPM dependencies
        run: npm ci

      - name: Run injection tests
        run: npm run test:inject -- --ci
